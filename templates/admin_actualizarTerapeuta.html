<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Terapeuta - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{url_for('static',filename='css/admin_base.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/admin_formulario.css')}}">
  </head>

  <body> <!-- Inicio de SIDEBAR -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <h1> Rehab IoT </h1>
      </div>
      <ul class="nav-links">
        <li><a href="{{url_for('admin_dashboard')}}"><i class="fa-solid fa-arrows-to-circle"></i>
            Dashboard</a></li>
        <li><a href="{{url_for('admin_obtenerPacientes')}}"> <i class="fa-solid fa-clipboard-user"></i>Pacientes</a></li>
        <li><a href="{{url_for('admin_obtenerTerapeutas')}}" class="active"> <i class="fa-solid fa-user-group"></i>
            Terapeutas</a></li>
        <li><a href="{{url_for('admin_obtenerSesiones')}}"> <i class="fa-solid fa-house-chimney-user"></i> Sesiones </a>
        </li>
        <li><a href="{{url_for('admin_obtenerBeacons')}}"><i class="fa-solid fa-cubes-stacked"></i> Zonas (Beacons)</a>
        </li>
        <li><a href="{{url_for('admin_reportes')}}"> <i class="fa-solid fa-book"></i> Reportes </a></li>
        <li><a href="{{url_for('logout')}}"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión</a></li>
      </ul>
    </nav>
    <!-- Fin de SIDEBAR -->

    <main class="main-content">
      <div class="form-card">
        <div class="form-header">
          <h2>Alta de Nuevo Usuario / Personal</h2>
          <p style="color: var(--text-light); margin: 5px 0 0 0;">Ingresa los datos del nuevo Terapeuta a la base de
          datos.
          </p>
        </div>

        <form action="{{url_for('admin_editar_terapeuta', id_terapeuta=terapeuta.id_terapeuta)}}" method="POST">
          <h3 class="section-title"><i class="fa-regular fa-address-card"></i> Datos Personales</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Nombre(s)</label>
              <input type="text" name="nombre" value="{{ terapeuta.nombre }}" required>
            </div>
            <div class="form-group">
              <label>Apellido Paterno</label>
              <input type="text" name="apellido_paterno" value="{{ terapeuta.apellido_paterno }}" required>
            </div>
            <div class="form-group">
              <label>Apellido Materno</label>
              <input type="text" name="apellido_materno" value="{{ terapeuta.apellido_materno }}">
            </div>
            <div class="form-group">
              <label>Especialidad Médica</label>

              <select name="especialidad" required>
                {% for esp in especialidades %}
                <option value="{{ esp.id_especialidad }}"
                {% if terapeuta.id_especialidad == esp.id_especialidad %}selected{% endif %}>
                {{ esp.nombre }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label>Teléfono (Móvil)</label>
              <input type="tel" name="telefono" value="{{ terapeuta.telefono }}">
            </div>
            <div class="form-group">
              <label>Correo</label>
              <input type="email" name="correo" value="{{ terapeuta.correo }}">
            </div>
            <div class="form-group full-width">
              <label>Observaciones</label>
              <textarea name="observaciones">{{ terapeuta.observaciones }}</textarea>
            </div>
          </div>
          <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> Guardar Terapeuta</button>
        </form>
    </main>
  </body>

</html>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analítica y Reportes - Rehab IoT</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{url_for('static',filename='css/admin_base.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/admin_reportes.css')}}">
    <style>
    </style>
  </head>
  <body>

    <nav class="sidebar">
      <div class="sidebar-header">
        <h1> Rehab IoT </h1>
      </div>
      <ul class="nav-links">
        <li><a href="{{url_for('admin_dashboard')}}" ><i class="fa-solid fa-arrows-to-circle"></i> Dashboard</a></li>
        <li><a href="{{url_for('admin_obtenerPacientes')}}"> <i class="fa-solid fa-clipboard-user"></i>Pacientes</a></li>
        <li><a href="{{url_for('admin_obtenerTerapeutas')}}"> <i class="fa-solid fa-user-group"></i> Terapeutas</a></li>
        <li><a href="{{url_for('admin_obtenerSesiones')}}"> <i class="fa-solid fa-house-chimney-user"></i> Sesiones </a></li>
        <li><a href="{{url_for('admin_obtenerBeacons')}}"><i class="fa-solid fa-cubes-stacked"></i> Zonas (Beacons)</a></li>
        <li><a href="{{url_for('admin_reportes')}}" class="active"> <i class="fa-solid fa-book"></i> Reportes </a></li>
        <li><a href="{{url_for('logout')}}"><i class="fa-solid fa-arrow-right-from-bracket"></i> Cerrar Sesión</a></li>
      </ul>
    </nav>
    <main class="main-content">

      <div class="header-actions">
        <div>
          <h2>Inteligencia y Analítica Clínica</h2>
          <p>Métricas de efectividad, asistencia y desempeño predictivo.</p>
        </div>
        <div style="display: flex; gap: 10px;">
          <button class="btn btn-export" onclick="window.print()">
            <i class="fa-solid fa-file-pdf"></i> Exportar PDF
          </button>
        </div>
      </div>

      <div class="chart-container full-width">
        <div class="chart-header">
          <h3>Tendencia de Asistencias</h3>
        </div>
        <div class="chart-wrapper">
          <div id="tendenciaChart" class="chart-loading">
            Cargando gráfica...
          </div>
        </div>
      </div>

        <div class="chart-container">
          <div class="chart-header">
            <h3>Métodos de Registro de Sesiones</h3>
          </div>
          <div class="chart-wrapper">
            <div id="metodosChart" style="width: 100%; height: 350px;"></div>
          </div>
        </div>
    </main>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="{{ url_for('static', filename='js/admin_charts.js') }}"></script>
  </body>
</html>
